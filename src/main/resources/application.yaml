spring:
  application:
    name: neo-bank
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

server:
  servlet:
    session:
      cookie:
        same-site: lax
        secure: true
        http-only: true

security:
  jwt:
    issuer: neo-bank
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
fx:
  provider:
    app-id: ${OPEN_EXCHANGE_RATES_APP_ID}
    base-url: https://openexchangerates.org
    connect-timeout: 2s
    read-timeout: 5s
  rate-lock:
    duration: 5m

card:
  limits:
    currencies:
      USD:
        default-per-transaction: 1000.00
        default-daily: 2500.00
        max-per-transaction: 5000.00
        max-daily: 10000.00
      EUR:
        default-per-transaction: 1000.00
        default-daily: 2500.00
        max-per-transaction: 5000.00
        max-daily: 10000.00
      GBP:
        default-per-transaction: 1000.00
        default-daily: 2500.00
        max-per-transaction: 5000.00
        max-daily: 10000.00
      TRY:
        default-per-transaction: 25000.00
        default-daily: 50000.00
        max-per-transaction: 150000.00
        max-daily: 300000.00

credit-account:
  default-credit-limits:
    USD: 5000.00
    EUR: 5000.00
    GBP: 5000.00
    TRY: 150000.00
